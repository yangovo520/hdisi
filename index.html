<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ededed">
<title>515：熄灯后，请勿开门</title>
<style>
:root{--bg:#ededed;--green:#95ec69;--ink:#191919;--muted:#8a8a8a;--red:#a52d36;--panel:#fff;--line:#e7e7e7}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#d8d8d8;color:var(--ink)}
body{display:flex;justify-content:center}.app{width:100%;max-width:480px;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
.top{height:58px;background:#ededed;display:flex;align-items:center;justify-content:space-between;padding:0 15px;border-bottom:1px solid #d8d8d8;flex-shrink:0}
.top .title{font-weight:650;font-size:17px}.top .sub{font-size:11px;color:#777;margin-top:3px}.iconbtn{border:0;background:transparent;font-size:22px;padding:7px;color:#222;cursor:pointer}
.status{height:28px;background:#f6f6f6;display:flex;align-items:center;justify-content:center;font-size:11px;color:#888;flex-shrink:0}
.tabs{display:flex;background:#f8f8f8;border-bottom:1px solid #ddd;flex-shrink:0}
.tab{flex:1;border:0;background:transparent;padding:12px 2px;font-size:13px;color:#777;border-bottom:2px solid transparent}.tab.active{color:#222;border-bottom-color:#222;font-weight:650}
#chatView{display:flex;flex-direction:column;flex:1;min-height:0}.chat{padding:14px 12px 8px;overflow:auto;flex:1;scroll-behavior:smooth}
.time{text-align:center;color:#aaa;font-size:11px;margin:14px 0}.notice{max-width:90%;margin:12px auto;background:#d9d9d9;color:#656565;font-size:12px;line-height:1.6;padding:7px 11px;border-radius:5px;text-align:center}
.msg{display:flex;gap:8px;margin:13px 0;align-items:flex-start;animation:fade .22s ease}.msg.me{flex-direction:row-reverse}.avatar{width:37px;height:37px;flex-shrink:0;border-radius:5px;background:#c7d2d8;display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden}.avatar.me{background:#b8d7a6}.bubblewrap{max-width:78%;min-width:0}.name{font-size:11px;color:#888;margin:0 0 5px}.me .name{text-align:right}.bubble{font-size:14px;line-height:1.65;background:#fff;border-radius:4px;padding:9px 11px;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 1px 1px #00000008}.me .bubble{background:var(--green)}.bubble.system{background:#e2e2e2;color:#555}.bubble.voice{min-width:130px;cursor:pointer}.voice small{display:block;color:#777;font-size:11px;margin-top:3px}.voiceicon{font-size:18px;margin-right:8px}
.composer{background:#f7f7f7;border-top:1px solid #d7d7d7;padding:10px 12px 14px;flex-shrink:0}.choices{display:flex;flex-direction:column;gap:8px}.choice{border:1px solid #d5d5d5;background:#fff;border-radius:8px;padding:12px 13px;text-align:left;font-size:13px;line-height:1.45;color:#222;cursor:pointer;transition:transform .08s,border .15s}.choice:active{transform:scale(.99)}.choice:disabled{opacity:.45}.hint{font-size:11px;color:#999;text-align:center;margin-top:9px}
.panel{display:none;flex:1;overflow:auto;padding:15px}.panel.show{display:block}.card{background:#fff;border-radius:10px;padding:15px;margin-bottom:12px;box-shadow:0 1px 3px #00000008}.card h3{font-size:15px;margin:0 0 8px}.card p{font-size:13px;line-height:1.75;margin:6px 0;color:#444}.tag{display:inline-block;font-size:10px;color:#8a3439;background:#f7e9e9;border-radius:4px;padding:3px 6px;margin-right:5px}.clue{border-left:3px solid #a52d36;padding:2px 0 2px 10px;margin:13px 0}.clue strong{font-size:13px}.clue p{margin:4px 0;color:#777;font-size:12px;line-height:1.6}.empty{color:#999;text-align:center;font-size:13px;padding:45px 15px;line-height:1.8}
.bottom{display:flex;gap:8px;margin-top:12px}.smallbtn{flex:1;background:#fff;border:1px solid #ddd;border-radius:7px;padding:10px;font-size:12px}
.overlay{position:absolute;inset:0;background:#000b;z-index:10;display:none;align-items:center;justify-content:center;padding:22px}.overlay.show{display:flex}.modal{background:#f7f7f7;border-radius:12px;width:100%;padding:20px;max-height:85vh;overflow:auto}.modal h2{font-size:19px;margin:0 0 10px}.modal p{font-size:13px;line-height:1.8;color:#444}.modal button{border:0;background:#222;color:#fff;border-radius:7px;padding:11px 14px;margin-top:8px;width:100%}
.glitch{animation:glitch .45s 2}.flash{position:absolute;inset:0;background:#fff;z-index:9;pointer-events:none;opacity:0}.flash.go{animation:flash .5s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}@keyframes flash{0%{opacity:0}15%{opacity:.9}35%{opacity:0}60%{opacity:.45}100%{opacity:0}}@keyframes glitch{0%,100%{transform:translateX(0)}20%{transform:translateX(-2px)}40%{transform:translateX(2px)}60%{filter:contrast(1.5)}80%{transform:translateX(-1px)}}
.intro{padding:22px 18px;background:#17191d;color:#eee;min-height:100dvh;display:flex;flex-direction:column;justify-content:center}.intro .eyebrow{font-size:11px;letter-spacing:3px;color:#b8a6a6}.intro h1{font-size:30px;line-height:1.25;letter-spacing:1px;margin:18px 0 12px}.intro .desc{font-size:13px;line-height:1.9;color:#c3c3c3}.intro .warning{border-left:2px solid #a52d36;padding-left:12px;margin:24px 0;color:#d7caca;font-size:12px;line-height:1.8}.intro button{background:#eee;color:#17191d;border:0;border-radius:8px;padding:14px;font-size:14px;font-weight:650;margin-top:12px}.intro .secondary{background:transparent;border:1px solid #555;color:#ddd}.hidden{display:none!important}
@media(min-width:500px){body{padding:16px 0}.app{min-height:calc(100dvh - 32px);height:calc(100dvh - 32px);border-radius:12px;box-shadow:0 8px 35px #0002}.intro{min-height:calc(100dvh - 32px)}}
</style>
</head>
<body>
<div class="app">
  <section id="intro" class="intro">
    <div class="eyebrow">FICTIONAL CAMPUS HORROR · CHAT NOVEL</div>
    <h1>515<br>熄灯后，请勿开门</h1>
    <div class="desc">浙江旅游职业学院 · 515宿舍<br>01:17，宿舍群里出现了一位没人认识的成员。<br>她说：小王，今晚别开门。</div>
    <div class="warning">本作中的人物、失踪事件、聊天记录及超自然情节均为虚构，仅借用学校名称作为故事背景，不代表真实校园事件。</div>
    <button id="startBtn">进入微信</button>
    <button id="continueBtn" class="secondary hidden">继续上次进度</button>
    <button id="resetBtn" class="secondary hidden">清除存档并重新开始</button>
  </section>
  <main id="game" class="hidden" style="display:flex;flex-direction:column;min-height:0;flex:1">
    <header class="top">
      <button class="iconbtn" id="backBtn" aria-label="返回">‹</button>
      <div style="text-align:center;flex:1"><div class="title" id="headTitle">515宿舍群</div><div class="sub" id="headSub">5人 · 微信</div></div>
      <button class="iconbtn" id="menuBtn" aria-label="菜单">⋯</button>
    </header>
    <div class="status" id="status">周三 01:17 · 手机电量 23%</div>
    <nav class="tabs">
      <button class="tab active" data-tab="chat">聊天</button>
      <button class="tab" data-tab="clues">线索</button>
      <button class="tab" data-tab="people">联系人</button>
      <button class="tab" data-tab="ending">档案</button>
    </nav>
    <section id="chatView">
      <div class="chat" id="chat"></div>
      <div class="composer"><div class="choices" id="choices"></div><div class="hint" id="hint">选择你的回复。每个决定都会留下痕迹。</div></div>
    </section>
    <section class="panel" id="cluesPanel"></section>
    <section class="panel" id="peoplePanel"></section>
    <section class="panel" id="endingPanel"></section>
  </main>
  <div class="flash" id="flash"></div>
  <div class="overlay" id="modal"><div class="modal" id="modalContent"></div></div>
</div>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const STORE="wx515_horror_save_v1";
const names={
  me:{name:"小王（我）",avatar:"🧑🏻‍🎓"},
  lin:{name:"林佳｜室友",avatar:"🧋"},
  qiu:{name:"阿秋｜闺蜜",avatar:"🐱"},
  chen:{name:"陈老师｜辅导员",avatar:"👩🏻‍💼"},
  guard:{name:"值班室",avatar:"☎️"},
  unknown:{name:"未知联系人",avatar:"🌑"},
  group:{name:"515宿舍群",avatar:"🏠"},
  archive:{name:"旧档案",avatar:"📁"},
  system:{name:"系统提示",avatar:"▫️"}
};
const state={node:"start",history:[],clues:[],flags:{},trust:0,nerve:0,chapter:1,ending:null,seen:[],activeTab:"chat",time:"01:17"};
function addClue(id,title,desc){if(!state.clues.some(c=>c.id===id)){state.clues.push({id,title,desc});}}
function flag(k,v=true){state.flags[k]=v;}
function say(who,text,opts={}){
  state.history.push({who,text,kind:opts.kind||"text",time:opts.time||state.time,meta:opts.meta||""});
  renderChat(true);
}
function note(text){say("system",text,{kind:"notice"});}
function msg(who,text){say(who,text);}
function me(text){say("me",text);}
function voice(who,text,duration){say(who,text,{kind:"voice",meta:duration||"8″"});}
function choices(arr,hint){renderChoices(arr,hint);}
function setNode(n){state.node=n;save();renderChoices([]);updateStatus();renderPanels();}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(STORE)||"null");if(s&&s.history){Object.assign(state,s);return true;}}catch(e){}return false;}
function updateStatus(){ $("status").textContent="周三 "+state.time+" · 手机电量 "+Math.max(4,23-state.history.length%19)+"%"; }
function renderChat(scroll){
 const box=$("chat");box.innerHTML="";
 state.history.forEach((m,i)=>{
  if(m.kind==="notice"){const d=document.createElement("div");d.className="notice";d.textContent=m.text;box.appendChild(d);return;}
  if(i===0||state.history[i-1].time!==m.time){const t=document.createElement("div");t.className="time";t.textContent=m.time;box.appendChild(t);}
  const who=names[m.who]||{name:m.who,avatar:"?"};
  const row=document.createElement("div");row.className="msg"+(m.who==="me"?" me":"");
  const av=document.createElement("div");av.className="avatar"+(m.who==="me"?" me":"");av.textContent=who.avatar;
  const wrap=document.createElement("div");wrap.className="bubblewrap";
  const nm=document.createElement("div");nm.className="name";nm.textContent=who.name;
  const b=document.createElement("div");b.className="bubble"+(m.kind==="voice"?" voice":"");
  if(m.kind==="voice"){b.innerHTML='<span class="voiceicon">◖)))</span>'+m.meta+'<small>点击播放语音转文字</small>';b.addEventListener("click",()=>{playTone();openModal("语音消息",m.text+"<br><br><span style='color:#888'>（语音由游戏内文字模拟，不包含真实录音）</span>");});}
  else b.textContent=m.text;
  wrap.append(nm,b);row.append(av,wrap);box.appendChild(row);
 });
 if(scroll)box.scrollTop=box.scrollHeight;
}
function renderChoices(arr,hint){
 const box=$("choices");box.innerHTML="";
 arr.forEach(c=>{const b=document.createElement("button");b.className="choice";b.textContent=c.label;b.onclick=()=>{if(c.action)c.action();};box.appendChild(b);});
 $("hint").textContent=hint|| (arr.length?"你的选择可能改变结局。":"剧情记录已保存。");
}
function showTab(tab){
 state.activeTab=tab;
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
 $("chatView").style.display=tab==="chat"?"flex":"none";
 ["clues","people","ending"].forEach(t=>$(t+"Panel").classList.toggle("show",tab===t));
 renderPanels();save();
}
function renderPanels(){
 const cp=$("cluesPanel");
 cp.innerHTML='<div class="card"><h3>线索档案</h3><p>小王收集到的证据会保存在这里。线索之间可能互相矛盾。</p></div>';
 if(!state.clues.length)cp.innerHTML+='<div class="empty">还没有线索。<br>聊天、语音和选择都可能藏着信息。</div>';
 state.clues.forEach(c=>{cp.innerHTML+='<div class="card"><div class="clue"><strong>'+esc(c.title)+'</strong><p>'+esc(c.desc)+'</p></div></div>';});
 const pp=$("peoplePanel");
 pp.innerHTML='<div class="card"><h3>联系人</h3><p>他们都声称自己了解515，但每个人的记忆似乎并不一致。</p></div>';
 [["lin","林佳","室友 · 一直说515只有三个人住。"],["qiu","阿秋","闺蜜 · 她记得你曾提过一个叫“许棠”的人。"],["chen","陈老师","辅导员 · 坚称学校没有相关失踪记录。"],["guard","值班室","夜间值班电话 · 说法前后矛盾。"],["unknown","未知联系人","没有头像，没有朋友圈，账号注册时间显示：明天。"]].forEach(p=>pp.innerHTML+='<div class="card"><h3>'+p[1]+'</h3><p>'+p[2]+'</p></div>');
 const ep=$("endingPanel");
 ep.innerHTML='<div class="card"><h3>故事档案</h3><p>章节：'+state.chapter+'/5</p><p>已收集线索：'+state.clues.length+' 条</p><p>你的选择记录：'+state.history.filter(m=>m.who==="me").length+' 次</p><p>当前结局：'+(state.ending||"尚未揭晓")+'</p><p>心理状态：'+(state.nerve>=4?"高度紧张":state.nerve>=2?"不安":"尚能保持冷静")+'</p></div>';
 if(state.ending){ep.innerHTML+='<div class="card"><h3>重新体验</h3><p>不同选择、线索和信任值会导向不同结局。</p><button class="smallbtn" id="replayBtn">重新开始</button></div>';setTimeout(()=>{const b=$("replayBtn");if(b)b.onclick=reset;},0);}
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function openModal(title,body,buttons){$("modalContent").innerHTML='<h2>'+esc(title)+'</h2><p>'+body+'</p>'+(buttons||'<button id="closeModal">知道了</button>');$("modal").classList.add("show");const b=$("closeModal");if(b)b.onclick=closeModal;}
function closeModal(){$("modal").classList.remove("show");}
function playTone(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=new C(),o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=520;g.gain.value=.035;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.09);o.onended=()=>ctx.close();}catch(e){}}
function scare(){ $("flash").classList.remove("go");void $("flash").offsetWidth;$("flash").classList.add("go");$("game").classList.add("glitch");setTimeout(()=>$("game").classList.remove("glitch"),850);playTone();}
function goChapter(n){state.chapter=n;save();}
function end(title,lines){
 state.ending=title;note("—— "+title+" ——");
 lines.forEach(x=>msg(x[0],x[1]));
 msg("system","故事暂告一段落。你的进度已保存。");
 setNode("ended");showTab("chat");
 choices([{label:"查看结局档案",action:()=>showTab("ending")},{label:"重新开始（清除本局进度）",action:reset}],"你已抵达一个结局。重新开始可探索其他分支。");
 renderPanels();save();
}
function reset(){localStorage.removeItem(STORE);state.node="start";state.history=[];state.clues=[];state.flags={};state.trust=0;state.nerve=0;state.chapter=1;state.ending=null;state.seen=[];state.time="01:17";state.activeTab="chat";$("intro").classList.remove("hidden");$("game").classList.add("hidden");$("continueBtn").classList.add("hidden");$("resetBtn").classList.add("hidden");closeModal();}
function start(){ $("intro").classList.add("hidden");$("game").classList.remove("hidden");state.history=[];state.clues=[];state.flags={};state.trust=0;state.nerve=0;state.chapter=1;state.ending=null;state.node="start";state.time="01:17";showTab("chat");chapter1();}
function resume(){ $("intro").classList.add("hidden");$("game").classList.remove("hidden");showTab(state.activeTab||"chat");renderChat(true);renderPanels();updateStatus();dispatchSavedNode();}
function dispatchSavedNode(){
 const map={start:chapter1,afterFirst:afterFirst,askRoommate:askRoommate,askFriend:askFriend,askTeacher:askTeacher,checkDoor:checkDoor,chapter2:chapter2,investigate:investigate,chapter3:chapter3,nightCall:nightCall,chapter4:chapter4,finalChoice:finalChoice,ended:()=>{renderPanels();choices([{label:"查看结局档案",action:()=>showTab("ending")},{label:"重新开始",action:reset}]);}};
 (map[state.node]||chapter1)();
}
function chapter1(){
 setNode("start");goChapter(1);
 note("01:17 · 515宿舍群聊");
 msg("group","林佳：谁把门口的外卖拿进来了？我没点。");
 msg("group","阿敏：我也没点，门口放着一个纸袋。");
 msg("group","林佳：……我们宿舍有阿敏吗？");
 msg("lin","小王，你醒着吗？别在群里回她。");
 msg("unknown","小王，你还在515吗？今晚不管谁敲门，都不要开。");
 msg("unknown","尤其是听见有人叫你全名的时候。");
 choices([
  {label:"问未知联系人：你是谁？",action:()=>{me("你是谁？你怎么知道我在515？");state.nerve++;state.flags.askedUnknown=true;afterFirst();}},
  {label:"先问林佳，群里的“阿敏”是谁",action:()=>{me("群里那个阿敏是谁？");state.trust++;state.flags.askedLin=true;askRoommate();}},
  {label:"截图发给闺蜜阿秋",action:()=>{me("我把群聊截图发给阿秋。");state.flags.sentScreenshot=true;askFriend();}}
 ],"第一反应很重要。暂时没有任何人承认认识那个名字。");
}
function afterFirst(){
 setNode("afterFirst");msg("unknown","因为你昨天晚上已经问过我一次了。");
 msg("unknown","你说：如果明天所有人都不记得她了，至少你会记得。");
 choices([
  {label:"追问“她”是谁",action:()=>{me("她是谁？");state.nerve++;msg("unknown","你真的不记得许棠了吗？");addClue("unknown","未知账号的消息","对方声称小王昨天已经和她聊过，并提到“许棠”。");chapter2();}},
  {label:"拉黑对方",action:()=>{me("我把这个账号拉黑。");flag("blockedUnknown");msg("system","你已拉黑该联系人。");setTimeout(()=>{scare();},60);msg("unknown","（对方已被拉黑，但新消息仍然出现）");state.nerve+=2;addClue("blocked","无法拉黑的账号","拉黑后仍收到新消息，聊天页面没有显示解除拉黑。");chapter2();}},
  {label:"先不回复，检查群成员",action:()=>{me("我没有回复，点开群成员列表。");flag("checkedGroup");addClue("groupCount","群成员列表","群聊显示5人，但头像数量只有4个；成员列表里一闪而过“许棠”。");chapter2();}}
 ]);
}
function askRoommate(){
 setNode("askRoommate");msg("lin","别提这个名字。我们寝室一直就三个人。");
 msg("lin","小王，你最近是不是太累了？");
 choices([
  {label:"问她：你认识许棠吗？",action:()=>{me("你认识许棠吗？");msg("lin","……你从哪儿听到这个名字的？");state.flags.linKnows=true;addClue("linSlip","林佳的失言","林佳先否认这个人存在，却在听见名字后明显慌张。");chapter2();}},
  {label:"不逼问，问门口纸袋",action:()=>{me("门口那个纸袋是谁的？");msg("lin","别碰它。里面是我们去年拍的合照。");state.flags.bag=true;addClue("paperBag","门口纸袋","林佳称纸袋里有去年合照，但你记得自己从没见过这张照片。");chapter2();}},
  {label:"让她陪自己去看监控",action:()=>{me("陪我去值班室看看走廊监控。");state.flags.linAccompanies=true;state.trust++;msg("lin","好。但如果监控里出现第四个人，你别看她的脸。");addClue("monitorWarning","监控警告","林佳同意陪你查监控，却要求你不要看清画面中的第四个人。");chapter2();}}
 ]);
}
function askFriend(){
 setNode("askFriend");msg("qiu","你怎么突然问这个？许棠不是你大一刚开学认识的学姐吗？");
 msg("qiu","等等……我刚才翻了我们的聊天记录，里面所有提到她的地方都变成了空白。");
 voice("qiu","我不是开玩笑。你先把门锁好，我现在给你打电话。","12″");
 choices([
  {label:"让阿秋把她记得的事说清楚",action:()=>{me("别挂电话，告诉我你记得什么。");state.trust+=2;state.flags.friendTrust=true;addClue("friendMemory","阿秋的记忆","阿秋记得许棠是学姐，却发现旧聊天里所有相关内容都变成空白。");chapter2();}},
